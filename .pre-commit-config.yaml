default_install_hook_types:
    - pre-commit

repos:
    # General file checks
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
            args: [--markdown-linebreak-ext=md]
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-json
          - id: check-added-large-files
            args: ["--maxkb=2048"]
          - id: check-merge-conflict
          - id: check-case-conflict
          - id: mixed-line-ending
            args: ["--fix=lf"]
          - id: detect-private-key

    # Ruff for the hook scripts under plugins/*/hooks. ruff.toml pins the target
    # to the oldest Python their PEP 723 headers allow, so the formatter cannot
    # emit syntax that only newer interpreters accept.
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.10
      hooks:
          # types_or overrides the hook's default, which in this version also
          # matches Markdown and would reformat the Python snippets inside the
          # eval prompts and skill references.
          - id: ruff-check
            args: [--fix, --exit-non-zero-on-fix]
            types_or: [python, pyi]
          - id: ruff-format
            types_or: [python, pyi]

    # Spell-checking prose — skills are mostly English, and a typo in a
    # description degrades trigger matching rather than failing loudly.
    - repo: https://github.com/codespell-project/codespell
      rev: v2.4.3
      hooks:
          - id: codespell
            additional_dependencies: [tomli]

    # Markdown structure — every skill and agent is Markdown, so lint the
    # bodies for broken tables, bad fences, and malformed links.
    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.23.3
      hooks:
          - id: markdownlint-cli2
            # Report only, never --fix. The config disables rules one by one,
            # so every rule a new markdownlint release adds is on by default,
            # and its fixer would rewrite skill bodies unseen. --fix has done
            # this once already: MD029 renumbered "- 2. Plan" contents entries
            # to "- 1." in every research skill that mirrors numbered headings.

    # Type-check the hook scripts. ty reads each script's PEP 723
    # requires-python, which is why a 3.14-only syntax shows up here too.
    - repo: local
      hooks:
          - id: ty-check
            name: ty-check
            language: system
            entry: uvx ty check
            pass_filenames: false
            types: [python]

    # Claude Code's own validators — the authority on plugin, marketplace,
    # skill, and agent schemas. These catch what a YAML parser cannot:
    # unknown frontmatter keys, malformed manifests, missing components.
    - repo: local
      hooks:
          - id: claude-validate-marketplace
            name: claude plugin validate (marketplace)
            language: system
            entry: claude plugin validate .
            pass_filenames: false
            files: ^\.claude-plugin/marketplace\.json$

          - id: claude-validate-plugins
            name: claude plugin validate (plugins)
            language: system
            entry: >-
                bash -c 'status=0;
                for p in plugins/*/; do
                  claude plugin validate "$p" >/dev/null 2>&1 || { echo "FAILED: $p"; claude plugin validate "$p"; status=1; };
                  for c in skills agents; do
                    [ -d "$p$c" ] && { claude plugin validate "$p$c" >/dev/null 2>&1 || { echo "FAILED: $p$c"; claude plugin validate "$p$c"; status=1; }; };
                  done;
                done;
                exit $status'
            pass_filenames: false
            files: ^plugins/
