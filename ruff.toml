# The hooks declare `requires-python = ">=3.14"` in their PEP 723 header, and
# `uv run --script` honours it, fetching 3.14 when it is missing. The target
# must not exceed that floor: a newer one could rewrite code into syntax the
# oldest accepted interpreter rejects, as the unparenthesised `except A, B:`
# form did before 3.14.
# A project ruff.toml replaces the global ~/.config/ruff/ruff.toml, so the
# rule selection is repeated here and not inherited.
target-version = "py314"

# Ruff 0.17 also formats Python code blocks inside Markdown. The eval prompts and
# the skill references contain deliberately unformatted or broken snippets, so
# only .py files are in scope.
include = ["*.py", "*.pyi"]

[lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "W191",
    "T201",
    "UP035",
    "N816",
    "W293",
    "DTZ005",
    "DTZ007",
    "S602",
    "UP009",
    "ERA001",
    "RET504",
    "TC002",
    "LOG015",
    "D203",
    "D213",
    "TD002",
    "TD003",
    "FIX002",
]
fixable = ["ALL"]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
